[project]
name = "vehsim"
version = "0.1.0"
description = "Week-by-week simulator for the start of production of a new vehicle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vehsim = "vehsim.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vehsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
